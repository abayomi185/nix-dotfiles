## NixOS LXC
## Video Recorder
## Template: replace <CTID>, add net0 (hwaddr and address) when allocated.
arch: amd64
cmode: console
cores: 2
features: nesting=1
hostname: video-recorder
memory: 2048
mp0: /mnt/mofp0/data/NAS-YOM/VideoProjects,mp=/srv/recordings
onboot: 1
ostype: unmanaged
rootfs: local-lvm:vm-<CTID>-disk-0,size=8G
swap: 0
unprivileged: 1
lxc.idmap: u 0 100000 1001
lxc.idmap: g 0 100000 100
lxc.idmap: u 1001 1001 1
lxc.idmap: g 100 100 1
lxc.idmap: u 1002 101002 64534
lxc.idmap: g 101 100101 65435
